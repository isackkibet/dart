name: yohpal_live_v2
description: YohPal Live V2
publish_to: none
version: 1.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  yohpal_live_streaming:
    path: ../../modules/live-streaming/flutter
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.3.10
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  provider: ^6.1.2
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  http: ^1.2.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  device_info_plus: ^13.2.0
  camera: ^0.11.0+2
  video_thumbnail: ^0.5.0
  image: ^4.8.0
  ffmpeg_kit_flutter_new: ^4.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  flutter_cache_manager: ^3.4.1
  livekit_client: ^2.3.1
  flutter_webrtc: ^0.12.12+hotfix.1
  web_socket_channel: ^3.0.1
  app_links: ^6.3.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3
  hive_ce: ^2.8.0
  hive_ce_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/Assets/logo.jpeg"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): logo fills the full 108dp canvas as background;
  # transparent foreground means no safe-zone shrinkage.
  adaptive_icon_background: "lib/Assets/logo.jpeg"
  adaptive_icon_foreground: "lib/Assets/launcher_fg_transparent.png"
  web:
    generate: false

flutter_native_splash:
  color: "#050816"
  image: lib/Assets/logo.jpeg
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - lib/Assets/icon.png
    - lib/Assets/google.png
    - lib/Assets/apple.png
